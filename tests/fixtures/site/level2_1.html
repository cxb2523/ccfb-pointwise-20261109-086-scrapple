    <tr>
        <th>name</th>
        <th>score</th>
        <th>note</th>
    </tr>
    <tr>
        <td>
            <table class="inner">
                <tr><td>alice</td></tr>
                <tr><td>bob</td></tr>
            </table>
        </td>
        <td>10</td>
        <!-- missing cell: no <td> for "note" -> must be None, row kept -->
    </tr>
    <tr>
        <td>carol</td>
        <td>8</td>
        <td></td>
    </tr>
</table>
